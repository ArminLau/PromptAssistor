[project]
name = "prompt-assistor-backend"
version = "0.1.0"
description = "PromptAssistor backend - AI prompt generation engine"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Armin"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.35",
    "alembic>=1.14.0",
    "llama-cpp-python>=0.3.6",
    "openai>=1.60.0",
    "ollama>=0.4.0",
    "httpx>=0.28.0",
    "Pillow>=11.0.0",
    "opencv-python>=4.10.0",
    "moviepy>=2.0.0",
    "pydub>=0.25.1",
    "PyYAML>=6.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
