<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PromptAssistor - AI Prompt Generation Assistant" />
    <title>PromptAssistor</title>
    <style>
      /* Loading screen before React mounts */
      #app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #666;
        background: #f5f5f5;
      }
      #app-loading h1 {
        font-size: 24px;
        color: #1677ff;
        margin-bottom: 8px;
      }
      #app-loading p {
        font-size: 14px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loading">
        <h1>PromptAssistor</h1>
        <p>加载中 / Loading...</p>
        <p style="font-size:12px;color:#ccc;margin-top:16px;">
          未连接后端？请先运行 / Backend not running? Run first:<br/>
          <code>scripts\dev_backend.bat</code>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
