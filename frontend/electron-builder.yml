appId: com.promptassistor.app
productName: PromptAssistor
copyright: Copyright © 2026 Armin

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*

extraResources:
  - from: ../backend
    to: backend
    filter:
      - "**/*"
      - "!data/**"
      - "!__pycache__/**"
      - "!*.pyc"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.developer-tools

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

dmg:
  title: PromptAssistor
